<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .chatbot {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 300px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: none;
            flex-direction: column;
            border-radius: 10px;
            overflow: hidden;
        }

        .chatbot-header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chatbot-body {
            padding: 10px;
            height: 200px;
            overflow-y: auto;
        }

        .chatbot-footer {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chatbot-footer input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .chatbot-footer button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .open-button {
            position: fixed;
            bottom: 15px;
            right: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .close-button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .bot-message {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .bot-message a {
            color: #007bff;
            text-decoration: none;
        }

        .bot-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="chatbot" class="chatbot">
        <div class="chatbot-header">
            <span>Chatbot</span>
            <button id="closeChatbot" class="close-button">&times;</button>
        </div>
        <div class="chatbot-body" id="chatbotBody">
            <p>Hello! How can I help you today?</p>
        </div>
        <div class="chatbot-footer">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button id="sendChat" class="send-button">Send</button>
        </div>
    </div>
    <button id="openChatbot" class="open-button">Chat</button>

    <script>
        document.getElementById('openChatbot').addEventListener('click', function() {
            document.getElementById('chatbot').style.display = 'flex';
            document.getElementById('openChatbot').style.display = 'none';
        });

        document.getElementById('closeChatbot').addEventListener('click', function() {
            document.getElementById('chatbot').style.display = 'none';
            document.getElementById('openChatbot').style.display = 'block';
        });

        document.getElementById('sendChat').addEventListener('click', sendMessage);

        document.getElementById('chatInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        
function sendMessage() {
    const chatInput = document.getElementById('chatInput');
    const chatBody = document.getElementById('chatbotBody');

    const message = chatInput.value.trim().toLowerCase();

    if (message === '') {
        return;
    }

    // Display the user's message
    const userMessage = document.createElement('p');
    userMessage.textContent = chatInput.value.trim();
    userMessage.style.textAlign = 'right';
    userMessage.style.marginBottom = '5px';

    chatBody.appendChild(userMessage);

    // Determine the appropriate response
let response;

if (/^(hello|hi|hey|good morning|good afternoon|good evening)\b/.test(message)) {
    response = 'Hello! Welcome. How can I help you today?';

} else if (message.includes('how are you')) {
    response = "I'm doing well, thank you! How can I assist you today?";

} else if (message.includes('whatsapp')) {
    response = 'You can reach us on WhatsApp: +9779846366349';

} else if (message.includes('messenger')) {
    response = 'You can message our team on Messenger: https://m.me/Illuminate%20Inception';

} else if (message.includes('facebook')) {
    response = 'Visit our Facebook page: https://www.facebook.com/profile.php?id=61562652415629';

} else if (message.includes('contact') || message.includes('phone')) {
    response = 'You can contact our team through WhatsApp or Messenger.';

} else if (message.includes('location') || message.includes('address')) {
    response = 'Please contact our team for location information.';

} else if (message.includes('thank')) {
    response = "You're welcome! Let us know if you need anything else.";

} else {
    response = "Sorry, I don't understand that question yet. Please contact our team for assistance.";
}


    // Display the chatbot response
    setTimeout(() => {
        const botMessage = document.createElement('p');
        botMessage.textContent = response;
        botMessage.classList.add('bot-message');

        chatBody.appendChild(botMessage);
        chatBody.scrollTop = chatBody.scrollHeight;
    }, 500);

    chatInput.value = '';
    chatBody.scrollTop = chatBody.scrollHeight;
}
    </script>
</body>
</html>
